[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pulso-transmi"
version = "0.1.0"
description = "SDK estudiantil para el reto MLOps Pulso TransMi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.28,<1",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5,<2", "joblib>=1.4,<2"]
dev = ["pytest>=8,<9"]
viz = ["matplotlib>=3.9,<4"]
dashboard = ["streamlit>=1.38,<2"]

[project.scripts]
pulso-transmi = "pulso_transmi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
