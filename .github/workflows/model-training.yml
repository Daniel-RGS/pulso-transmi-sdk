name: pulso-transmi-retrain

on:
  workflow_dispatch:
  schedule:
    # Reentrenar cada 6 horas para capturar datos nuevos del stream
    - cron: "0 */6 * * *"

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # Necesario para hacer push del modelo actualizado

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[ml]'

      - name: Train models with latest data
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: python -m src.train

      - name: Commit updated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/models.pkl
          # Solo hacer commit si el modelo cambió
          if git diff --cached --quiet; then
            echo "No changes to model, skipping commit."
          else
            git commit -m "chore: retrain model with latest stream data [skip ci]"
            git push
          fi