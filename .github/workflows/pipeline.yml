name: pulso-transmi-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: write   # Necesario para auto-dispararse

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[ml]'

      - name: Run pipeline
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: python -m src.predict

      - name: Esperar 5 minutos y re-disparar
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Esperando 5 minutos antes de re-disparar el pipeline..."
          sleep 300
          gh workflow run pipeline.yml --repo ${{ github.repository }}
          echo "Pipeline re-disparado exitosamente."
