name: pulso-transmi-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

# Cancelar runs concurrentes — solo un run a la vez
concurrency:
  group: pulso-transmi-pipeline
  cancel-in-progress: false   # No cancelar el que corre, sino quedar en cola

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 4   # Ciclos son de 15min, 4 min es suficiente para predict

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[ml]'

      - name: Run pipeline
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: python -m src.predict
