name: pulso-transmi-pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e '.[ml]'

      - name: Run pipeline
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
        run: python -m src.predict
